name: Daily projections

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install numpy
        run: pip install --quiet numpy

      - name: Pull the last few days of results
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python scripts/update_data.py

      - name: Rebuild the page
        run: python scripts/build_page.py

      - name: Commit if anything changed
        run: |
          git config user.name "projector-bot"
          git config user.email "actions@github.com"
          git add data.db index.html
          if git diff --staged --quiet; then
            echo "no change today"
          else
            git commit -m "projections $(date -u +%Y-%m-%d)"
            git push
          fi
